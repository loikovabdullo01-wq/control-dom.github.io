<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <title>ХИСРАВ СОХТМОН • Система управления недвижимостью</title>
  <link rel="icon" type="image/png" href="logg.png">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  
  <style>
    :root {
      /* Light Theme Colors */
      --gold: #c9a84c;
      --gold-light: #e5c96e;
      --gold-dark: #a8892e;
      --graphite: #1a1f2e;
      --graphite-light: #2a3142;
      --graphite-lighter: #3a4256;
      --emerald: #10b981;
      --emerald-light: #34d399;
      --emerald-bg: #ecfdf5;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --yellow: #f59e0b;
      --yellow-bg: #fffbeb;
      --gray: #adb5bd;
      --gray-bg: #f8f9fa;
      --text-primary: #1a2236;
      --text-secondary: #5b6e8c;
      --text-muted: #94a3b8;
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold);
    }

    /* ----- SIDEBAR ----- */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 40;
      transition: var(--transition);
      box-shadow: 2px 0 10px rgba(0,0,0,0.03);
    }

    .logo-area {
      padding: 0 8px;
      text-align: center;
    }

    .company-name {
      font-weight: 700;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .system-sub {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 4px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--gold);
      transform: scaleY(0);
      transition: var(--transition);
    }

    .nav-item:hover {
      background: #f1f5f9;
      color: var(--text-primary);
    }

    .nav-item:hover::before {
      transform: scaleY(1);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(201,168,76,0.05));
      color: var(--gold-dark);
      font-weight: 600;
    }

    .nav-item.active::before {
      transform: scaleY(1);
    }

    .bottom-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(201,168,76,0.2);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn:hover {
      box-shadow: 0 6px 12px rgba(201,168,76,0.3);
      transform: translateY(-2px);
    }

    .btn.secondary {
      background: #f1f5f9;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    .btn.secondary:hover {
      background: #e2e8f0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .btn.danger {
      background: linear-gradient(135deg, var(--red), #dc2626);
      color: white;
      box-shadow: 0 4px 6px rgba(239,68,68,0.2);
    }

    /* ----- MAIN CONTENT ----- */
    .main-content {
      margin-left: 280px;
      flex: 1;
      padding: 24px 28px 32px;
      min-height: 100vh;
      width: 100%;
      transition: var(--transition);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
    }

    .date-profile {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-secondary);
      font-weight: 500;
      background: var(--bg-card);
      padding: 10px 20px;
      border-radius: 40px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .search-wrapper {
      background: var(--bg-card);
      border-radius: 40px;
      padding: 4px 4px 4px 20px;
      display: flex;
      align-items: center;
      width: 320px;
      border: 1px solid var(--border-color);
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .search-wrapper:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(201,168,76,0.2);
    }

    .search-wrapper input {
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
      background: transparent;
      color: var(--text-primary);
    }

    .search-wrapper input::placeholder {
      color: var(--text-muted);
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transform: scaleX(0);
      transition: var(--transition);
    }

    .stat-card:hover::before {
      transform: scaleX(1);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }

    .stat-value {
      font-weight: 700;
      font-size: 2rem;
      color: var(--gold-dark);
    }

    .stat-label {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.85rem;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title {
      font-weight: 600;
      font-size: 1.3rem;
      margin: 24px 0 16px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Houses Grid */
    .houses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .house-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .house-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transform: scaleX(0);
      transition: var(--transition);
    }

    .house-card:hover::before {
      transform: scaleX(1);
    }

    .house-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }

    /* СТАТУС-ИНДИКАТОРЫ: цвет рамки и фона карточки */
    .house-card.status-free {
      border-left: 6px solid #adb5bd;
      background: #ffffff;
    }
    .house-card.status-sold {
      border-left: 6px solid #20b26b;
      background: #f0fdf4;
    }
    .house-card.status-installment {
      border-left: 6px solid #e5ad19;
      background: #fffbeb;
    }
    .house-card.status-debtor {
      border-left: 6px solid #e04455;
      background: #fef2f2;
    }

    /* Круглый индикатор статуса */
    .status-dot {
      width: 12px;
      height: 12px;
      min-width: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }
    .status-dot.free { background: #adb5bd; }
    .status-dot.sold { background: #20b26b; }
    .status-dot.installment { background: #e5ad19; }
    .status-dot.debtor { background: #e04455; }

    .status-container {
      display: flex;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #f1f5f9;
      color: var(--text-primary);
      margin-left: 8px;
    }

    .progress-bg {
      background: #e2e8f0;
      height: 8px;
      border-radius: 10px;
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      height: 8px;
      border-radius: 10px;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Apartment Grid */
    .apartment-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin: 16px 0;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .apt-cell {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      font-weight: 600;
      border: 2px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .apt-cell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, transparent, rgba(0,0,0,0.02));
      opacity: 0;
      transition: var(--transition);
    }

    .apt-cell:hover::before {
      opacity: 1;
    }

    .apt-cell:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }

    /* Обновленные стили для ячеек квартир с круглыми индикаторами */
    .apt-free {
      background: #ffffff;
      border-color: #adb5bd;
      color: #495057;
    }
    .apt-sold {
      background: #f0fdf4;
      border-color: #20b26b;
      color: #065f46;
    }
    .apt-installment {
      background: #fffbeb;
      border-color: #e5ad19;
      color: #92400e;
    }
    .apt-overdue {
      background: #fef2f2;
      border-color: #e04455;
      color: #991b1b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(239,68,68,0.2); }
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: modalFade 0.3s ease;
    }

    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--bg-secondary);
      border-radius: 24px;
      padding: 32px;
      max-width: 650px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .table-mini {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .table-mini td, .table-mini th {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
      color: var(--text-primary);
    }

    .table-mini th {
      color: var(--gold-dark);
      font-weight: 600;
      background: #f8fafc;
    }

    /* Status dots for payment table */
    .status-dot-gray {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b7280;
      display: inline-block;
      margin-right: 5px;
    }
    .status-dot-red {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      margin-right: 5px;
    }
    .status-dot-orange {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f59e0b;
      display: inline-block;
      margin-right: 5px;
    }
    .status-dot-green {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      margin-right: 5px;
    }

    /* ==================== REPORTS ==================== */
    .report-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 16px 0;
    }
    .report-filters select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    .report-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .report-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .report-card-date {
      font-weight: 700;
      color: var(--gold-dark);
    }
    .report-card-text {
      white-space: pre-wrap;
      color: var(--text-primary);
      margin: 10px 0;
    }
    .report-card-images {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .report-card-images img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border-color);
    }
    .report-dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }
    .report-dropzone.dragover {
      border-color: var(--gold);
      background: var(--gold-light, #e5c96e22);
      color: var(--gold-dark);
    }
    .report-thumbs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .report-thumb {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .report-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .report-thumb .remove-thumb {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }
    .report-table-editor {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }
    .report-table-editor td {
      border: 1px solid var(--border-color);
      padding: 8px;
      min-width: 60px;
      color: var(--text-primary);
    }
    .report-table-editor td[contenteditable] {
      outline: none;
    }
    .report-table-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .report-table-actions button {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.8rem;
    }
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      cursor: zoom-out;
    }
    .lightbox-overlay img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 500;
      z-index: 200;
      border: 1px solid var(--gold);
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.3s ease;
    }

    /* Filter buttons */
    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: white;
      border-color: var(--gold);
      box-shadow: 0 4px 6px rgba(201,168,76,0.2);
    }

    /* Loading indicator */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border-color);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .main-content {
        margin-left: 0;
        padding: 16px;
        padding-bottom: 80px;
      }
      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--bg-secondary);
        justify-content: flex-start;
        overflow-x: auto;
        padding: 10px 8px;
        border-top: 1px solid var(--border-color);
        z-index: 50;
        box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
      }
      .mobile-nav button {
        background: none;
        border: none;
        font-weight: 500;
        color: var(--text-secondary);
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 0 0 auto;
        min-width: 64px;
        font-size: 0.7rem;
        cursor: pointer;
      }
      .mobile-nav button.active {
        color: var(--gold-dark);
        font-weight: 700;
      }
      .search-wrapper {
        width: 100%;
      }
    }

    @media (min-width: 769px) {
      .mobile-nav {
        display: none;
      }
    }

    /* ==================== AUTH OVERLAY ==================== */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;

  <script>
(function() {
      // ==================== AUTH GATE ====================
      const AUTH_PASSWORD = '9712208000';
      const AUTH_KEY = 'khisrav_auth';

      function initAuthGate() {
        const overlay = document.getElementById('authOverlay');
        const input = document.getElementById('authPasswordInput');
        const errorEl = document.getElementById('authError');
        const submitBtn = document.getElementById('authSubmitBtn');

        if (sessionStorage.getItem(AUTH_KEY) === '1') {
          overlay.style.display = 'none';
          return;
        }

        function tryLogin() {
          if (input.value === AUTH_PASSWORD) {
            sessionStorage.setItem(AUTH_KEY, '1');
            overlay.style.display = 'none';
            errorEl.textContent = '';
          } else {
            errorEl.textContent = '❌ Неверный пароль';
            input.value = '';
            input.focus();
          }
        }

        submitBtn.addEventListener('click', tryLogin);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
        input.focus();
      }
      initAuthGate();

      // ==================== FIREBASE CONFIGURATION ====================
      const firebaseConfig = {
        apiKey: "AIzaSyCO93lwu3eW46nxJJM3BhG2qkMobp89CYE",
        authDomain: "control-dom-509c9.firebaseapp.com",
        projectId: "control-dom-509c9",
        storageBucket: "control-dom-509c9.firebasestorage.app",
        messagingSenderId: "63569681012",
        appId: "1:63569681012:web:cfc3de1fd5efd942a28f21"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      
      // ==================== STATE MANAGEMENT ====================
      let state = {
        houses: [],
        apartments: [],
        clients: [],
        payments: []
      };
      let currentFilter = 'all';
      let isSyncing = false;
      let lastSyncTime = null;
      let pendingChanges = new Set();
      let lastLoadTime = 0;
      const LOAD_COOLDOWN = 60000;
      const SYNC_DEBOUNCE = 3000;
      let syncTimeout = null;

      // ==================== SMART SYNC ====================
      async function syncToFirebase() {
        if (isSyncing || pendingChanges.size === 0) return;
        
        if (syncTimeout) {
          clearTimeout(syncTimeout);
          syncTimeout = null;
        }
        
        isSyncing = true;
        updateSyncStatus('syncing');
        
        try {
          const batch = db.batch();
          let hasChanges = false;
          
          pendingChanges.forEach(changeKey => {
            const [collection, id] = changeKey.split(':');
            const collectionData = state[collection];
            
            if (collectionData) {
              const item = collectionData.find(i => i.id === id);
              if (item) {
                const docRef = db.collection(collection).doc(id);
                batch.set(docRef, item, { merge: true });
                hasChanges = true;
              }
            }
          });
          
          if (hasChanges) {
            await batch.commit();
            lastSyncTime = new Date();
            pendingChanges.clear();
            updateSyncStatus('synced');
          } else {
            updateSyncStatus('synced');
          }
        } catch (error) {
          console.error('Sync error:', error);
          
          if (error.code === 'resource-exhausted' || error.message?.includes('resource-exhausted')) {
            updateSyncStatus('error', 'Превышена квота. Изменения сохранены локально.');
            toast('⚠️ Превышена квота Firestore. Данные сохранены локально.');
          } else {
            updateSyncStatus('error');
          }
        } finally {
          isSyncing = false;
        }
      }

      function scheduleSync(collection, id) {
        if (collection && id) {
          pendingChanges.add(`${collection}:${id}`);
        }
        
        if (syncTimeout) {
          clearTimeout(syncTimeout);
        }
        
        syncTimeout = setTimeout(() => {
          syncToFirebase();
        }, SYNC_DEBOUNCE);
      }

      async function loadFromFirebase(force = false) {
        const now = Date.now();
        
        if (!force && now - lastLoadTime < LOAD_COOLDOWN) {
          return state.houses.length > 0 || state.apartments.length > 0;
        }
        
        updateSyncStatus('syncing');
        
        try {
          const [housesSnapshot, apartmentsSnapshot, clientsSnapshot, paymentsSnapshot] = 
            await Promise.all([
              db.collection('houses').get(),
              db.collection('apartments').get(),
              db.collection('clients').get(),
              db.collection('payments').get()
            ]);
          
          const houses = [];
          housesSnapshot.forEach(doc => houses.push({ id: doc.id, ...doc.data() }));
          
          const apartments = [];
          apartmentsSnapshot.forEach(doc => apartments.push({ id: doc.id, ...doc.data() }));
          
          const clients = [];
          clientsSnapshot.forEach(doc => clients.push({ id: doc.id, ...doc.data() }));
          
          const payments = [];
          paymentsSnapshot.forEach(doc => payments.push({ id: doc.id, ...doc.data() }));
          
          if (houses.length > 0 || apartments.length > 0) {
            state = { houses, apartments, clients, payments };
            lastSyncTime = new Date();
            lastLoadTime = now;
            updateSyncStatus('synced');
            return true;
          }
          
          updateSyncStatus('empty');
          return false;
        } catch (error) {
          console.error('Load error:', error);
          
          if (error.code === 'resource-exhausted' || error.message?.includes('resource-exhausted')) {
            updateSyncStatus('error', 'Превышена квота. Используются кэшированные данные.');
            toast('⚠️ Превышена квота Firestore.');
            return state.houses.length > 0 || state.apartments.length > 0;
          }
          
          updateSyncStatus('error');
          return state.houses.length > 0 || state.apartments.length > 0;
        }
      }

      function updateSyncStatus(status, customMessage = '') {
        const statusElement = document.getElementById('syncStatus');
        if (!statusElement) return;
        
        switch(status) {
          case 'syncing':
            statusElement.innerHTML = '<span class="loading"></span> Синхронизация...';
            statusElement.style.color = 'var(--text-muted)';
            break;
          case 'synced':
            let timeText = 'только что';
            if (lastSyncTime) {
              try {
                const date = lastSyncTime instanceof Date ? lastSyncTime : new Date(lastSyncTime);
                if (!isNaN(date.getTime())) {
                  timeText = date.toLocaleTimeString('ru-RU');
                }
              } catch (e) {
                timeText = 'только что';
              }
            }
            statusElement.innerHTML = `✅ Синхронизировано ${timeText}`;
            statusElement.style.color = 'var(--emerald)';
            break;
          case 'error':
            statusElement.innerHTML = customMessage || '⚠️ Ошибка синхронизации';
            statusElement.style.color = 'var(--red)';
            break;
          case 'empty':
            statusElement.innerHTML = 'База данных пуста';
            statusElement.style.color = 'var(--yellow)';
            break;
        }
      }

      // ==================== DEMO DATA ====================
      function initDemoData() {
        const blocks = [
          { id: 'block-a', name: 'Блок А', address: 'ул. Камоли Хукандий', floors: 10, status: 'не начали' },
          { id: 'block-b', name: 'Блок Б', address: 'ул. Камоли Хукандий', floors: 10, status: 'Строится' },
          { id: 'block-v', name: 'Блок В', address: 'ул. Камоли Хукандий', floors: 10, status: 'Почти готов' }
        ];

        state.houses = blocks;
        state.apartments = [];
        state.clients = [];
        state.payments = [];

        let aptCounter = 0;

        blocks.forEach(block => {
          for (let i = 1; i <= 5; i++) {
            aptCounter++;
            state.apartments.push({
              id: `apt-${aptCounter}`,
              houseId: block.id,
              type: 'basement',
              floor: 0,
              number: `П${String(i).padStart(2, '0')}`,
              rooms: 0,
              area: 35 + Math.floor(Math.random() * 15),
              price: 18000 + Math.floor(Math.random() * 8000),
              status: 'available',
              clientId: null,
              installment: null
            });
          }

          for (let floor = 1; floor <= 9; floor++) {
            for (let i = 1; i <= 8; i++) {
              aptCounter++;
              state.apartments.push({
                id: `apt-${aptCounter}`,
                houseId: block.id,
                type: floor <= 2 ? 'commercial' : 'residential',
                floor: floor,
                number: `${floor}${String(i).padStart(2, '0')}`,
                rooms: floor <= 2 ? 0 : 1 + Math.floor(Math.random() * 3),
                area: floor <= 2 ? 45 + Math.floor(Math.random() * 25) : 55 + Math.floor(Math.random() * 35),
                price: floor <= 2 ? 28000 + Math.floor(Math.random() * 12000) : 40000 + Math.floor(Math.random() * 25000),
                status: 'available',
                clientId: null,
                installment: null
              });
            }
          }

          for (let i = 1; i <= 5; i++) {
            aptCounter++;
            state.apartments.push({
              id: `apt-${aptCounter}`,
              houseId: block.id,
              type: 'penthouse',
              floor: 10,
              number: `10${String(i).padStart(2, '0')}`,
              rooms: 3 + Math.floor(Math.random() * 2),
              area: 95 + Math.floor(Math.random() * 40),
              price: 85000 + Math.floor(Math.random() * 40000),
              status: 'available',
              clientId: null,
              installment: null
            });
          }
        });

        console.log(`Сгенерировано: ${blocks.length} блоков, ${state.apartments.length} квартир`);
        return { houses: blocks, apartments: state.apartments };
      }

      // ==================== RESTORE TO FIREBASE ====================
      async function restoreAllData() {
        const { houses, apartments } = initDemoData();

        let batch = db.batch();
        houses.forEach(house => {
          const ref = db.collection('houses').doc(house.id);
          batch.set(ref, house);
        });
        await batch.commit();
        console.log('Дома записаны');

        for (let i = 0; i < apartments.length; i += 400) {
          batch = db.batch();
          const chunk = apartments.slice(i, i + 400);
          chunk.forEach(apt => {
            const ref = db.collection('apartments').doc(apt.id);
            batch.set(ref, apt);
          });
          await batch.commit();
          console.log(`Записано квартир: ${Math.min(i + 400, apartments.length)} / ${apartments.length}`);
        }

        console.log(`=== ГОТОВО: ${houses.length} блока + ${apartments.length} квартир записаны в Firebase ===`);
        toast('✅ Данные восстановлены');
      }
      window.restoreAllData = restoreAllData;

      async function resetDb() {
        const [clientsSnapshot, paymentsSnapshot, apartmentsSnapshot] = await Promise.all([
          db.collection('clients').get(),
          db.collection('payments').get(),
          db.collection('apartments').get()
        ]);
        const operations = [
          ...clientsSnapshot.docs.map(doc => ({ type: 'delete', ref: doc.ref })),
          ...paymentsSnapshot.docs.map(doc => ({ type: 'delete', ref: doc.ref })),
          ...apartmentsSnapshot.docs.map(doc => ({
            type: 'update',
            ref: doc.ref,
            data: { status: 'available', clientId: null, installment: null }
          }))
        ];

        for (let index = 0; index < operations.length; index += 450) {
          const batch = db.batch();
          operations.slice(index, index + 450).forEach(operation => {
            if (operation.type === 'delete') {
              batch.delete(operation.ref);
            } else {
              batch.update(operation.ref, operation.data);
            }
          });
          await batch.commit();
        }

        state.clients = [];
        state.payments = [];
        state.apartments = state.apartments.map(apartment => apartment ? {
          ...apartment,
          status: 'available',
          clientId: null,
          installment: null
        } : apartment);
        pendingChanges.clear();
        render();
        console.log(`Database reset complete: ${clientsSnapshot.size} clients deleted, ${paymentsSnapshot.size} payments deleted, ${apartmentsSnapshot.size} apartments reset.`);
      }
      window.resetDb = resetDb;

      // ==================== HELPERS ====================
      const getHouse = id => state.houses.find(h => h.id === id);
      const getApt = id => state.apartments.find(a => a.id === id);
      const getClient = id => state.clients.find(c => c.id === id);
      const getPaymentsByApt = aptId => state.payments.filter(p => p.apartmentId === aptId).sort((a, b) => a.date.localeCompare(b.date));

      function calcDashboardStats() {
        const apartments = Array.isArray(state.apartments) ? state.apartments : [];
        const payments = Array.isArray(state.payments) ? state.payments : [];
        const validAmount = value => typeof value === 'number' && Number.isFinite(value) ? value : 0;
        const apartmentStatus = apartment => apartment ? String(apartment.status ?? '').trim() : '';
        const totalApts = apartments.length;
        const free = apartments.filter(apt => apartmentStatus(apt) === 'available').length;
        const sold = apartments.filter(apt => apartmentStatus(apt) === 'sold').length;
        const installment = apartments.filter(apt => apartmentStatus(apt) === 'installment').length;
        const totalSalesSum = apartments
          .filter(apt => ['sold', 'installment'].includes(apartmentStatus(apt)))
          .reduce((sum, apt) => sum + validAmount(apt.price), 0);
        const paidTotal = payments
          .filter(payment => payment?.status === 'paid')
          .reduce((sum, payment) => sum + validAmount(payment.amount), 0);
        let pendingTotal = totalSalesSum === 0 || (sold === 0 && installment === 0)
          ? 0
          : totalSalesSum - paidTotal;
        if (pendingTotal < 0 || Number.isNaN(pendingTotal)) pendingTotal = 0;
        const overdueCount = payments.filter(payment => payment?.status === 'overdue').length;
        return { totalApts, free, sold, installment, paidTotal, pendingTotal, overdueCount };
      }

      function formatMoney(val) { 
        return new Intl.NumberFormat('ru-RU').format(val) + ' с.'; 
      }

        if (!dateStr) return ''; 
        const d = new Date(dateStr); 
        return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }); 
      }

      function toast(msg) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => {
          t.style.opacity = '0';
          t.style.transition = 'opacity 0.3s';
          setTimeout(() => t.remove(), 300);
        }, 2500);
      }

      // ==================== RENDER ENGINE ====================

      let currentHouseId = null;
      let currentFloor = null;

      function render() {
        const container = document.getElementById('mainContent');
        if (!container) return;
        
        container.style.opacity = '0';
        container.style.transition = 'opacity 0.3s';
        
        setTimeout(() => {
          switch (currentPage) {
            case 'dashboard': renderDashboard(container); break;

            case 'floor-detail': renderFloorDetail(container); break;

          }
          container.style.opacity = '1';
        }, 150);
      }

      function renderDashboard(container) {
        const stats = calcDashboardStats();
        const upcoming = state.payments
          .filter(p => p.status === 'pending' && new Date(p.date) >= new Date())
          .sort((a, b) => a.date.localeCompare(b.date))
          .slice(0, 5);

              <input placeholder="🔍 Поиск квартиры, клиента, телефона..." id="globalSearch" oninput="window.handleGlobalSearch(this.value)">

            </div>

              <div class="stat-value">${stats.totalApts}</div>

      // ==================== INSTALLMENT PLAN ====================
      const BLOCK_INSTALLMENT_YEARS = { 'block-a': 3, 'block-b': 3, 'block-v': 1 };
      const INSTALLMENT_START_DATE = '2025-08-01';

      function buildInstallmentPlan(apt) {
        const years = BLOCK_INSTALLMENT_YEARS[apt.houseId] || 1;
        const termMonths = years * 12;
        const initialPayment = Math.round(apt.price * 0.3);
        const financedAmount = apt.price - initialPayment;
        const baseMonthly = Math.floor(financedAmount / termMonths);
        const remainder = financedAmount - baseMonthly * termMonths;
        const startDate = new Date(INSTALLMENT_START_DATE + 'T00:00:00');
        const today = new Date();
        const payments = [];
        
        for (let i = 0; i < termMonths; i++) {
          const d = new Date(startDate.getFullYear(), startDate.getMonth() + i + 1, 0);
          const dateStr = d.toISOString().split('T')[0];
          
          let status;
          if (d < today) {
            status = 'overdue';
          } else {
            status = 'pending';
          }
          
          payments.push({
            dateStr: dateStr,
            amount: baseMonthly + (i === termMonths - 1 ? remainder : 0),
            status: status
          });
        }
        
        return { 
          years, 
          termMonths, 
          initialPayment, 
          monthlyPayment: baseMonthly, 
          startDate: INSTALLMENT_START_DATE, 
          payments 
        };
      }

      window.sellApartment = function(aptId) {
        const apt = getApt(aptId);
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
          <div class="modal-content">
            <span style="float:right;cursor:pointer;font-size:1.5rem;color: var(--text-secondary);" onclick="this.closest('.modal').remove()">&times;</span>
            <h3 style="color: var(--gold-dark);">Продажа объекта №${apt.number}</h3>
            <div style="margin-top: 20px; display: grid; gap: 12px;">
              <input id="clientName" placeholder="ФИО покупателя" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);">
              <input id="clientPhone" placeholder="Телефон" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);">
              <input id="clientEmail" placeholder="Email (опционально)" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);">
              <select id="payType" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);">
                <option value="full">Полная оплата</option>
                <option value="installment">Рассрочка</option>
              </select>
              <div id="installDetails" style="display:none; background: var(--bg-primary); border-radius: 12px; padding: 14px; font-size: 0.9rem; color: var(--text-secondary);"></div>
              <button class="btn" id="confirmSale" style="margin-top:8px;">Подтвердить продажу</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);

        const installDetailsEl = modal.querySelector('#installDetails');
        function renderInstallDetails() {
          const plan = buildInstallmentPlan(apt);
          installDetailsEl.innerHTML = `
            <div>📅 Период: ${formatDate(plan.payments[0].dateStr)} — ${formatDate(plan.payments[plan.payments.length - 1].dateStr)} (${plan.years} г.)</div>
            <div>💰 Первый взнос (30%): <strong>${formatMoney(plan.initialPayment)}</strong></div>
            <div>📆 Ежемесячный платёж: <strong>${formatMoney(plan.monthlyPayment)}</strong></div>
            <div>📊 Всего платежей: <strong>${plan.termMonths}</strong></div>
          `;
        }

        document.getElementById('payType').onchange = function() {
          const isInstallment = this.value === 'installment';
          installDetailsEl.style.display = isInstallment ? 'block' : 'none';
          if (isInstallment) renderInstallDetails();
        };

        document.getElementById('confirmSale').onclick = () => {
          const name = document.getElementById('clientName').value.trim();
          const phone = document.getElementById('clientPhone').value.trim();
          if (!name || !phone) return alert('Введите данные покупателя');
          
          const client = { 
            id: 'c' + Date.now(), 
            name, 
            phone, 
            email: document.getElementById('clientEmail').value.trim() 
          };
          state.clients.push(client);
          apt.clientId = client.id;
          
          if (document.getElementById('payType').value === 'full') {
            apt.status = 'sold';
            apt.installment = null;
          } else {
            const plan = buildInstallmentPlan(apt);
            apt.status = 'installment';
            apt.installment = {
              months: plan.termMonths,
              termYears: plan.years,
              startDate: plan.startDate,
              initialPayment: plan.initialPayment,
              monthlyPayment: plan.monthlyPayment
            };
            plan.payments.forEach((pp, i) => {
              state.payments.push({
                id: 'p' + Date.now() + '_' + i,
                apartmentId: apt.id,
                clientId: client.id,
                date: pp.dateStr,
                amount: pp.amount,
                status: pp.status
              });
            });
          }
          
          // Синхронизируем только изменённые данные
          scheduleSync('clients', client.id);
          scheduleSync('apartments', apt.id);
          state.payments.forEach(p => scheduleSync('payments', p.id));
          
          modal.remove();
          render();
          toast('✅ Продажа завершена');
        };
      };

      // ==================== INSTALLMENT PAYMENTS MODAL ====================
      window.openInstallmentPayments = function(aptId) {

        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `

            <div style="margin-top: 16px; display: flex; gap: 16px; flex-wrap: wrap;">
              <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; flex: 1; min-width: 150px;">
                <div style="font-size: 0.85rem; color: var(--text-secondary);">Всего оплачено:</div>
                <div style="font-weight: 700; color: var(--emerald);" id="totalPaidDisplay">${formatMoney(payments.filter(p => p.status === 'paid').reduce((s, p) => s + p.amount, 0))}</div>
              </div>
              <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; flex: 1; min-width: 150px;">

              </div>
            </div>
            <table class="table-mini" style="margin-top: 20px;">
              <tr><th>№</th><th>Дата</th><th>Сумма</th><th>Статус</th></tr>
              ${payments.map((p, idx) => `
                <tr id="payment-row-${p.id}">
                  <td>${idx + 1}</td>
                  <td>${formatDate(p.date)}</td>
                  <td>
                    <input type="number" value="${p.amount}" 
                      onchange="window.updatePaymentAmount('${p.id}', this.value)"
                      style="width:110px;padding:6px 8px;border-radius:8px;border:1px solid var(--border-color);background:${p.status === 'unpaid' ? '#f3f4f6' : 'var(--bg-primary)'};color:${p.status === 'unpaid' ? '#9ca3af' : 'var(--text-primary)'};">
                  </td>
                  <td>
                    <select onchange="window.updatePaymentStatus('${p.id}', this.value)"
                      style="padding:6px 8px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);">
                      <option value="unpaid" ${p.status === 'unpaid' ? 'selected' : ''}>⚪ Не оплачено</option>
                      <option value="overdue" ${p.status === 'overdue' ? 'selected' : ''}>🔴 Не оплачено (просрочено)</option>
                      <option value="partial" ${p.status === 'partial' ? 'selected' : ''}>🟡 Частично</option>
                      <option value="paid" ${p.status === 'paid' ? 'selected' : ''}>✅ Оплачено</option>
                    </select>
                  </td>
                </tr>
              `).join('')}
            </table>
          </div>
        `;
        document.body.appendChild(modal);
      };

      window.updatePaymentAmount = function(paymentId, value) {
        const p = state.payments.find(p => p.id === paymentId);
        if (!p) return;
        const amount = parseFloat(value);
        if (isNaN(amount) || amount < 0) return;
        p.amount = amount;
        scheduleSync('payments', paymentId);
        
        updatePaymentTotals(p.apartmentId);
        toast('✅ Сумма обновлена');
      };

      window.updatePaymentStatus = function(paymentId, value) {
        const p = state.payments.find(p => p.id === paymentId);
        if (!p) return;
        
        p.status = value;
        
        if (value === 'unpaid') {
          p.amount = 0;
        }
        
        if (value === 'paid') {
          p.paidDate = new Date().toISOString().split('T')[0];
        } else {
          delete p.paidDate;
        }
        
        scheduleSync('payments', paymentId);
        
        const row = document.getElementById(`payment-row-${paymentId}`);
        if (row) {
          const input = row.querySelector('input[type="number"]');
          const select = row.querySelector('select');
          if (input) {
            input.value = p.amount;
            input.style.background = value === 'unpaid' ? '#f3f4f6' : 'var(--bg-primary)';
            input.style.color = value === 'unpaid' ? '#9ca3af' : 'var(--text-primary)';
          }
          if (select) {
            select.value = value;
          }
        }
        
        updatePaymentTotals(p.apartmentId);
        toast('✅ Статус обновлён');
      };

      function updatePaymentTotals(aptId) {
        const payments = getPaymentsByApt(aptId);
        const totalPaid = payments.filter(p => p.status === 'paid').reduce((s, p) => s + p.amount, 0);
        const remaining = payments.filter(p => p.status !== 'paid' && p.amount > 0).reduce((s, p) => s + p.amount, 0);
        
        const totalPaidDisplay = document.getElementById('totalPaidDisplay');
        const remainingDisplay = document.getElementById('remainingDisplay');
        if (totalPaidDisplay) totalPaidDisplay.textContent = formatMoney(totalPaid);
        if (remainingDisplay) remainingDisplay.textContent = formatMoney(remaining);
      }

      window.markPaid = function(paymentId) {
        const p = state.payments.find(p => p.id === paymentId);
        if (p) { 
          p.status = 'paid'; 
          p.paidDate = new Date().toISOString().split('T')[0]; 
          scheduleSync('payments', paymentId);
          render(); 
          document.querySelector('.modal')?.remove(); 
          toast('✅ Платеж отмечен'); 
        }
      };

        const total = state.payments.filter(p => p.status === 'paid').reduce((s, p) => s + p.amount, 0);

        state.payments.filter(p => p.status === 'paid').forEach(p => {

      // ==================== REPORTS ====================
      const REPORT_AUTHORS = {
        abdulloh: 'Абдуллох',
        firdavs: 'Фирдавс',
        faridun: 'Фаридун',
        hisrav: 'Хисрав'
      };

      const reportsState = {};
      const PAGE_SIZE = 10;

      function getReportState(slug) {
        if (!reportsState[slug]) {
          reportsState[slug] = { all: [], filtered: [], visibleCount: PAGE_SIZE, loaded: false };
        }
        return reportsState[slug];
      }

      async function loadReports(slug) {
        const rs = getReportState(slug);
        try {
          const snapshot = await db.collection('reports').where('authorSlug', '==', slug).get();
          const docs = [];
          snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
          docs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          rs.all = docs;
          rs.loaded = true;
        } catch (error) {
          console.error('loadReports error:', error);
          toast('⚠️ Ошибка загрузки отчётов');
        }
      }

      function applyReportFilters(slug) {
        const rs = getReportState(slug);
        const year = document.getElementById('filterYear')?.value || '';
        const month = document.getElementById('filterMonth')?.value || '';
        const day = document.getElementById('filterDay')?.value || '';
        rs.filtered = rs.all.filter(r => {
          if (year && String(r.year) !== year) return false;
          if (month && String(r.month) !== month) return false;
          if (day && String(r.day) !== day) return false;
          return true;
        });
        rs.visibleCount = PAGE_SIZE;
        renderReportsList(slug);
      }
      window.applyReportFilters = applyReportFilters;

      window.showOlderReports = function(slug) {
        const rs = getReportState(slug);
        rs.visibleCount += PAGE_SIZE;
        renderReportsList(slug);
      };

      function reportFilterOptions() {
        const now = new Date();
        const years = [];
        for (let y = now.getFullYear() - 2; y <= now.getFullYear() + 1; y++) years.push(y);
        return { now, years };
      }

      async function renderReportPage(container, slug) {
        const authorName = REPORT_AUTHORS[slug];
        const rs = getReportState(slug);
        const { now, years } = reportFilterOptions();

        container.innerHTML = `
          <h2>Отчёт ${authorName}</h2>
          <div class="report-filters">
            <select id="filterYear" onchange="window.applyReportFilters('${slug}')">
              <option value="">Год: все</option>
              ${years.map(y => `<option value="${y}" ${y === now.getFullYear() ? 'selected' : ''}>${y}</option>`).join('')}
            </select>
            <select id="filterMonth" onchange="window.applyReportFilters('${slug}')">
              <option value="">Месяц: все</option>
              ${Array.from({ length: 12 }, (_, i) => i + 1).map(m => `<option value="${m}" ${m === now.getMonth() + 1 ? 'selected' : ''}>${String(m).padStart(2, '0')}</option>`).join('')}
            </select>
            <select id="filterDay" onchange="window.applyReportFilters('${slug}')">
              <option value="">День: все</option>
              ${Array.from({ length: 31 }, (_, i) => i + 1).map(d => `<option value="${d}" ${d === now.getDate() ? 'selected' : ''}>${String(d).padStart(2, '0')}</option>`).join('')}
            </select>
            <button class="btn" onclick="window.openReportModal('${slug}')">+ Добавить отчёт</button>
          </div>
          <div id="reportsList">Загрузка...</div>
        `;

        if (!rs.loaded) await loadReports(slug);
        applyReportFilters(slug);
      }
      window.renderReportPage = renderReportPage;

      function renderReportsList(slug) {
        const rs = getReportState(slug);
        const list = document.getElementById('reportsList');
        if (!list) return;

        if (rs.filtered.length === 0) {
          list.innerHTML = `<div style="color: var(--text-muted); padding: 20px 0;">Отчётов не найдено.</div>`;
          return;
        }

        const visible = rs.filtered.slice(0, rs.visibleCount);
        list.innerHTML = visible.map(r => reportCardHTML(slug, r)).join('') +
          (rs.filtered.length > rs.visibleCount
            ? `<button class="btn secondary" onclick="window.showOlderReports('${slug}')">Показать старые</button>`
            : '');
      }

      function reportCardHTML(slug, r) {
        const tableHTML = (r.table && r.table.length)
          ? `<table class="table-mini"><tbody>${r.table.map(row => `<tr>${row.map(cell => `<td>${cell || ''}</td>`).join('')}</tr>`).join('')}</tbody></table>`
          : '';
        const imagesHTML = (r.images && r.images.length)
          ? `<div class="report-card-images">${r.images.map(src => `<img src="${src}" onclick="window.openLightbox('${src}')">`).join('')}</div>`
          : '';

        return `
          <div class="report-card">
            <div class="report-card-header">
              <span class="report-card-date">${r.dateStr}</span>
              <div style="display:flex; gap:8px;">
                <button class="btn secondary" onclick="window.openReportModal('${slug}', '${r.id}')">✏️ Редактировать</button>
                <button class="btn secondary" onclick="window.deleteReport('${slug}', '${r.id}')">🗑️ Удалить</button>
              </div>
            </div>
            ${r.text ? `<div class="report-card-text">${r.text}</div>` : ''}
            ${tableHTML}
            ${imagesHTML}
          </div>
        `;
      }

      window.deleteReport = async function(slug, reportId) {
        if (!confirm('Удалить этот отчёт?')) return;
        try {
          await db.collection('reports').doc(reportId).delete();
          const rs = getReportState(slug);
          rs.all = rs.all.filter(r => r.id !== reportId);
          applyReportFilters(slug);
          toast('🗑️ Отчёт удалён');
        } catch (error) {
          console.error('deleteReport error:', error);
          toast('⚠️ Ошибка удаления');
        }
      };

      let editingTable = [['', '', ''], ['', '', '']];
      let editingImages = [];

      function syncTableFromDOM() {
        const rows = document.querySelectorAll('#tableEditorWrap tr');
        if (!rows.length) return;
        editingTable = Array.from(rows).map(tr => Array.from(tr.querySelectorAll('td')).map(td => td.textContent));
      }

      function renderTableEditor() {
        const wrap = document.getElementById('tableEditorWrap');
        if (!wrap) return;
        wrap.innerHTML = `
          <table class="report-table-editor"><tbody>
            ${editingTable.map(row => `<tr>${row.map(cell => `<td contenteditable="true">${cell || ''}</td>`).join('')}</tr>`).join('')}
          </tbody></table>
        `;
      }

      window.reportTableAddRow = function() {
        syncTableFromDOM();
        editingTable.push(new Array(editingTable[0]?.length || 3).fill(''));
        renderTableEditor();
      };
      window.reportTableAddCol = function() {
        syncTableFromDOM();
        editingTable.forEach(row => row.push(''));
        renderTableEditor();
      };
      window.reportTableRemoveRow = function() {
        syncTableFromDOM();
        if (editingTable.length > 1) editingTable.pop();
        renderTableEditor();
      };
      window.reportTableRemoveCol = function() {
        syncTableFromDOM();
        if (editingTable[0].length > 1) editingTable.forEach(row => row.pop());
        renderTableEditor();
      };

      function resizeImageFile(file, maxWidth = 800, quality = 0.6) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const scale = Math.min(1, maxWidth / img.width);
              const canvas = document.createElement('canvas');
              canvas.width = img.width * scale;
              canvas.height = img.height * scale;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function renderImageThumbs() {
        const wrap = document.getElementById('reportThumbs');
        if (!wrap) return;
        wrap.innerHTML = editingImages.map((src, i) => `
          <div class="report-thumb">
            <img src="${src}" onclick="window.openLightbox('${src}')">
            <button class="remove-thumb" onclick="window.removeReportImage(${i})">&times;</button>
          </div>
        `).join('');
      }

      window.removeReportImage = function(i) {
        editingImages.splice(i, 1);
        renderImageThumbs();
      };

      async function handleReportFiles(fileList) {
        const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
        const remaining = 3 - editingImages.length;
        if (remaining <= 0) {
          toast('⚠️ Максимум 3 изображения');
          return;
        }
        for (const file of files.slice(0, remaining)) {
          try {
            const dataUrl = await resizeImageFile(file);
            editingImages.push(dataUrl);
          } catch (error) {
            console.error('resizeImageFile error:', error);
          }
        }
        renderImageThumbs();
      }

      window.openLightbox = function(src) {
        const overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';
        overlay.innerHTML = `<img src="${src}">`;
        overlay.onclick = () => overlay.remove();
        document.body.appendChild(overlay);
      };

      window.openReportModal = function(slug, reportId = null) {
        const rs = getReportState(slug);
        const existing = reportId ? rs.all.find(r => r.id === reportId) : null;

        editingTable = existing ? JSON.parse(JSON.stringify(existing.table || [['', '', '']])) : [['', '', ''], ['', '', '']];
        editingImages = existing ? [...(existing.images || [])] : [];

        const todayStr = new Date().toISOString().split('T')[0];
        const dateValue = existing ? existing.dateStr : todayStr;

        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
          <div class="modal-content">
            <span style="float:right;cursor:pointer;font-size:1.5rem;color: var(--text-secondary);" onclick="this.closest('.modal').remove()">&times;</span>
            <h3 style="color: var(--gold-dark);">${existing ? 'Редактировать отчёт' : 'Добавить отчёт'} — ${REPORT_AUTHORS[slug]}</h3>
            <div style="margin-top: 20px; display: grid; gap: 12px;">
              <input id="reportDate" type="date" value="${dateValue}" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);">
              <textarea id="reportText" placeholder="Комментарий / описание" rows="4" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);">${existing?.text || ''}</textarea>

              <div>
                <div id="tableEditorWrap"></div>
                <div class="report-table-actions">
                  <button onclick="window.reportTableAddRow()">+ Строка</button>
                  <button onclick="window.reportTableAddCol()">+ Столбец</button>
                  <button onclick="window.reportTableRemoveRow()">- Строка</button>
                  <button onclick="window.reportTableRemoveCol()">- Столбец</button>
                </div>
              </div>

              <div>
                <div class="report-dropzone" id="reportDropzone">📷 Перетащите до 3 изображений или нажмите, чтобы выбрать</div>
                <input type="file" id="reportFileInput" accept="image/*" multiple style="display:none;">
                <div class="report-thumbs" id="reportThumbs"></div>
              </div>

              <button class="btn" id="saveReport" style="margin-top:8px;">Сохранить</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);

        renderTableEditor();
        renderImageThumbs();

        const dropzone = document.getElementById('reportDropzone');
        const fileInput = document.getElementById('reportFileInput');
        dropzone.onclick = () => fileInput.click();
        fileInput.onchange = e => handleReportFiles(e.target.files);
        dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('dragover'); };
        dropzone.ondragleave = () => dropzone.classList.remove('dragover');
        dropzone.ondrop = e => {
          e.preventDefault();
          dropzone.classList.remove('dragover');
          handleReportFiles(e.dataTransfer.files);
        };

        document.getElementById('saveReport').onclick = async () => {
          syncTableFromDOM();
          const dateStr = document.getElementById('reportDate').value || todayStr;
          const [year, month, day] = dateStr.split('-').map(Number);
          const text = document.getElementById('reportText').value;

          const report = {
            id: existing ? existing.id : `rep_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            authorSlug: slug,
            authorName: REPORT_AUTHORS[slug],
            year, month, day, dateStr,
            text,
            table: editingTable,
            images: editingImages,
            createdAt: existing ? existing.createdAt : Date.now()
          };

          try {
            await db.collection('reports').doc(report.id).set(report);
            if (existing) {
              Object.assign(existing, report);
            } else {
              rs.all.unshift(report);
            }
            modal.remove();
            applyReportFilters(slug);
            toast('✅ Отчёт сохранён');
          } catch (error) {
            console.error('saveReport error:', error);
            toast('⚠️ Ошибка сохранения отчёта');
          }
        };
      };

      // -------------------- EXPORT/IMPORT --------------------
      document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'backup_khisrav.json';
        a.click();
        toast('📤 Данные экспортированы');
      });
      
      document.getElementById('importBtn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = e => { 
          const file = e.target.files[0]; 
          const reader = new FileReader(); 
          reader.onload = () => { 
            state = JSON.parse(reader.result); 
            state.houses.forEach(h => scheduleSync('houses', h.id));
            state.apartments.forEach(a => scheduleSync('apartments', a.id));
            state.clients.forEach(c => scheduleSync('clients', c.id));
            state.payments.forEach(p => scheduleSync('payments', p.id));
            render(); 
            toast('📥 Данные импортированы'); 
          }; 
          reader.readAsText(file); 
        };
        input.click();
      });

      // -------------------- INIT --------------------
      window.navigate = navigate;
      
      async function initApp() {
        const loaded = await loadFromFirebase(true);
        
        if (!loaded) {
          initDemoData();
          state.houses.forEach(h => scheduleSync('houses', h.id));
          state.apartments.forEach(a => scheduleSync('apartments', a.id));
          state.clients.forEach(c => scheduleSync('clients', c.id));
          state.payments.forEach(p => scheduleSync('payments', p.id));
        }
        
        render();
        
        window.addEventListener('beforeunload', () => {
          if (pendingChanges.size > 0) {
            syncToFirebase();
          }
        });
        
        setInterval(() => {
          loadFromFirebase(true);
        }, 15 * 60 * 1000);
      }
      
      initApp();

      document.querySelectorAll('.nav-item, .mobile-nav button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const page = e.currentTarget.dataset.page;
          if (page) navigate(page);
        });
      });
    })();
  </script>
</body>
</html>
