/* =========================================================
   АВТОРИЗАЦИЯ (SSO MANAGER TOKEN)
   ========================================================= */
const ACCESS_PASSWORD = '181279';
const STORAGE_KEY = 'sso_manager_token';
const STORAGE_VALUE = 'verified_true';

(function initAuth() {
  const loginScreen = document.getElementById('loginScreen');
  const form = document.getElementById('loginForm');
  const input = document.getElementById('password');
  const error = document.getElementById('loginError');

  // Если уже авторизован — сразу скрываем экран входа
  if (localStorage.getItem(STORAGE_KEY) === STORAGE_VALUE) {
    loginScreen.classList.add('hidden-login');
  } else {
    setTimeout(() => input.focus(), 100);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value === ACCESS_PASSWORD) {
      localStorage.setItem(STORAGE_KEY, STORAGE_VALUE);
      loginScreen.classList.add('hidden-login');
      input.value = '';
      error.classList.add('hidden');
    } else {
      error.classList.remove('hidden');
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
      input.select();
    }
  });

  // Выход — очищаем токен
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    loginScreen.classList.remove('hidden-login');
    input.value = '';
    error.classList.add('hidden');
    setTimeout(() => input.focus(), 200);
  });
})();

/* =========================================================
   LAYOUT: 11 уровней (0..10), суммарно по 76 квартир на блок
   ========================================================= */
const LAYOUT = [
  {floor:0,  units:[1,2,3,4,5]},
  {floor:1,  units:[1,2,3,4,5]},
  {floor:2,  units:[1,2,3,4,5]},
  {floor:3,  units:[1,2,3,4,5,6,7,8]},
  {floor:4,  units:[1,2,3,4,5,6,7,8]},
  {floor:5,  units:[1,2,3,4,5,6,7,8]},
  {floor:6,  units:[1,2,3,4,5,6,7,8]},
  {floor:7,  units:[1,2,3,4,5,6,7,8]},
  {floor:8,  units:[1,2,3,4,5,6,7,8]},
  {floor:9,  units:[1,2,3,4,5,6,7,8]},
  {floor:10, units:[1,2,3,4,5]}
];
const BLOCKS = ['А','Б','В'];

/* Генерация всех 228 объектов (по 76 на блок) */
const ALL_OBJECTS = [];
BLOCKS.forEach(block => {
  LAYOUT.forEach(({floor, units}) => {
    units.forEach(unit => {
      const number = `${floor}/${unit}`;
      const occ = OCCUPIED.find(o => o.block === block && o.number === number);
      if (occ) {
        const hasOwner = !!occ.name;
        const bal = (occ.baqiya === null || occ.baqiya === undefined) ? null : Number(occ.baqiya);
        ALL_OBJECTS.push({
          block, number, floor, unit,
          name: occ.name || '',
          area: occ.area,
          price: occ.price,
          roomAmount: occ.roomAmount,
          paid: occ.paid || 0,
          baqiya: bal,
          history: occ.history || [],
          status: !hasOwner ? 'free' : (bal === 0 ? 'sold' : 'installment')
        });
      } else {
        ALL_OBJECTS.push({
          block, number, floor, unit,
          name: '', area: null, price: null, roomAmount: null,
          paid: 0, baqiya: null, history: [], status: 'free'
        });
      }
    });
  });
});

/* =========================================================
   KPI и форматирование
   ========================================================= */
function calcKpi(objects) {
  const total = objects.length;
  const sold = objects.filter(o => o.status === 'sold').length;
  const inst = objects.filter(o => o.status === 'installment').length;
  const free = objects.filter(o => o.status === 'free').length;
  const paid = objects.reduce((s, o) => s + (o.paid || 0), 0);
  const baqiya = objects.reduce((s, o) => s + (o.baqiya || 0), 0);
  return { total, sold, inst, free, paid, baqiya };
}

const KPI = calcKpi(ALL_OBJECTS);

function money(v) {
  return new Intl.NumberFormat('ru-RU').format(Math.round(v || 0)) + ' с.';
}

function renderKpi() {
  const el = document.getElementById('kpi');
  const items = [
    { label:'Всего объектов',       value: KPI.total,          color:'text-slate-100' },
    { label:'Продано',              value: KPI.sold,           color:'text-emerald-400' },
    { label:'В рассрочке',          value: KPI.inst,           color:'text-amber-400' },
    { label:'Свободно',             value: KPI.free,           color:'text-slate-400' },
    { label:'Итого получено',       value: money(KPI.paid),    color:'text-emerald-300' },
    { label:'Остаток к получению',  value: money(KPI.baqiya),  color:'text-rose-300' }
  ];
  el.innerHTML = items.map(i => `
    <div class="bg-[#0f1624] border border-slate-800 rounded-2xl px-3 py-2.5">
      <div class="text-[10px] uppercase tracking-wide text-slate-500">${i.label}</div>
      <div class="text-sm sm:text-base font-semibold ${i.color} truncate">${i.value}</div>
    </div>
  `).join('');
}

/* =========================================================
   UI STATE
   ========================================================= */
const state = {
  block: 'ALL',
  status: 'all',
  search: ''
};

function filteredObjects() {
  return ALL_OBJECTS.filter(o => {
    if (state.block !== 'ALL' && o.block !== state.block) return false;
    if (state.status !== 'all' && o.status !== state.status) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = `${o.name} ${o.number} ${o.block}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* =========================================================
   TABS / FILTERS
   ========================================================= */
function renderTabs() {
  const el = document.getElementById('tabs');
  const tabs = [
    { id:'ALL', label:'Все блоки' },
    { id:'А',   label:'Блок А' },
    { id:'Б',   label:'Блок Б' },
    { id:'В',   label:'Блок В' }
  ];
  el.innerHTML = tabs.map(t => `
    <button data-block="${t.id}" class="px-4 py-2 rounded-xl text-sm border transition whitespace-nowrap
      ${state.block === t.id ? 'bg-brand-500 text-slate-950 border-brand-500 font-medium' : 'bg-[#0f1624] border-slate-700 text-slate-300 hover:border-slate-500'}">
      ${t.label}
    </button>
  `).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { state.block = btn.dataset.block; renderAll(); };
  });
}

function renderStatusFilter() {
  const el = document.getElementById('statusFilter');
  const statuses = [
    { id:'all',         label:'Все статусы' },
    { id:'sold',        label:'Продано' },
    { id:'installment', label:'Рассрочка' },
    { id:'free',        label:'Свободно' }
  ];
  el.innerHTML = statuses.map(s => `
    <button data-status="${s.id}" class="px-3 py-1.5 rounded-lg text-xs border transition whitespace-nowrap
      ${state.status === s.id ? 'bg-slate-100 text-slate-900 border-slate-100 font-medium' : 'bg-[#0f1624] border-slate-700 text-slate-300 hover:border-slate-500'}">
      ${s.label}
    </button>
  `).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { state.status = btn.dataset.status; renderAll(); };
  });
}

/* =========================================================
   CHESSBOARD
   ========================================================= */
function cellClass(status) {
  if (status === 'sold') return 'cell-sold';
  if (status === 'installment') return 'cell-inst';
  return 'cell-free';
}

function renderChessboard(block) {
  const objects = ALL_OBJECTS.filter(o => o.block === block);
  const floors = [...new Set(LAYOUT.map(l => l.floor))].sort((a,b) => b - a);
  const maxUnits = Math.max(...LAYOUT.map(l => l.units.length));

  let rows = '';
  floors.forEach(floor => {
    const units = LAYOUT.find(l => l.floor === floor).units;
    let cells = '';
    for (let i = 1; i <= maxUnits; i++) {
      if (units.includes(i)) {
        const obj = objects.find(o => o.floor === floor && o.unit === i);
        cells += `
          <button data-block="${block}" data-number="${obj.number}"
            class="cell ${cellClass(obj.status)} border rounded-lg h-9 sm:h-10 text-[10px] sm:text-xs font-medium transition hover:scale-[1.03]"
            title="${obj.number} · ${obj.name || 'Свободно'}">
            ${obj.number}
          </button>
        `;
      } else {
        cells += `<div class="h-9 sm:h-10"></div>`;
      }
    }
    rows += `
      <div class="flex items-center gap-1.5">
        <div class="w-7 text-[10px] text-slate-500 text-right">${floor}</div>
        <div class="grid flex-1 gap-1.5" style="grid-template-columns: repeat(${maxUnits}, minmax(0,1fr));">${cells}</div>
      </div>
    `;
  });

  const k = calcKpi(objects);
  return `
    <div class="bg-[#0f1624] border border-slate-800 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h3 class="font-semibold">Блок ${block}</h3>
        <div class="text-[10px] text-slate-400 flex gap-3">
          <span class="text-emerald-400">Продано: ${k.sold}</span>
          <span class="text-amber-400">Рассрочка: ${k.inst}</span>
          <span>Свободно: ${k.free}</span>
        </div>
      </div>
      <div class="space-y-1.5 overflow-x-auto">${rows}</div>
    </div>
  `;
}

function renderChessboards() {
  const el = document.getElementById('chessboards');
  const blocks = state.block === 'ALL' ? BLOCKS : [state.block];
  el.innerHTML = blocks.map(b => renderChessboard(b)).join('');

  el.querySelectorAll('button[data-number]').forEach(btn => {
    btn.onclick = () => {
      const block = btn.dataset.block;
      const number = btn.dataset.number;
      const obj = ALL_OBJECTS.find(o => o.block === block && o.number === number);
      openModal(obj);
    };
  });
}

/* =========================================================
   TABLE
   ========================================================= */
function statusBadge(status) {
  if (status === 'sold') return `<span class="px-2 py-0.5 rounded-md text-[10px] bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">Продано</span>`;
  if (status === 'installment') return `<span class="px-2 py-0.5 rounded-md text-[10px] bg-amber-500/15 text-amber-300 border border-amber-500/30">Рассрочка</span>`;
  return `<span class="px-2 py-0.5 rounded-md text-[10px] bg-slate-700/40 text-slate-400 border border-slate-600/40">Свободно</span>`;
}

function renderTable() {
  const objects = filteredObjects();
  const wrap = document.getElementById('tableWrap');
  document.getElementById('filteredCount').textContent = `${objects.length} шт.`;

  if (!objects.length) {
    wrap.innerHTML = `<div class="p-6 text-center text-sm text-slate-500">Ничего не найдено</div>`;
    return;
  }

  wrap.innerHTML = `
    <table class="w-full text-xs">
      <thead class="bg-[#0f1624] sticky top-0">
        <tr class="text-left text-slate-400">
          <th class="px-3 py-2 font-medium">№</th>
          <th class="px-3 py-2 font-medium">Покупатель</th>
          <th class="px-3 py-2 font-medium">Статус</th>
          <th class="px-3 py-2 font-medium text-right">Оплачено</th>
          <th class="px-3 py-2 font-medium text-right">Остаток</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-800">
        ${objects.map(o => `
          <tr class="hover:bg-slate-800/40 cursor-pointer" data-block="${o.block}" data-number="${o.number}">
            <td class="px-3 py-2 whitespace-nowrap font-medium">${o.block}-${o.number}</td>
            <td class="px-3 py-2 truncate max-w-[140px]">${o.name || '—'}</td>
            <td class="px-3 py-2">${statusBadge(o.status)}</td>
            <td class="px-3 py-2 text-right whitespace-nowrap">${o.paid ? money(o.paid) : '—'}</td>
            <td class="px-3 py-2 text-right whitespace-nowrap">${o.baqiya ? money(o.baqiya) : (o.baqiya === 0 ? '0 с.' : '—')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  wrap.querySelectorAll('tr[data-number]').forEach(tr => {
    tr.onclick = () => {
      const obj = ALL_OBJECTS.find(o => o.block === tr.dataset.block && o.number === tr.dataset.number);
      openModal(obj);
    };
  });
}

/* =========================================================
   MODAL / BOTTOM SHEET
   ========================================================= */
function openModal(obj) {
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');
  document.getElementById('modalTitle').textContent = `Блок ${obj.block} · ${obj.number}`;

  const historyRows = obj.history && obj.history.length
    ? obj.history.map(h => `
        <tr class="border-b border-slate-800/60">
          <td class="py-2 text-slate-400">${h.m}</td>
          <td class="py-2 text-right font-medium">${money(h.v)}</td>
        </tr>
      `).join('')
    : `<tr><td colspan="2" class="py-4 text-center text-slate-500">Нет помесячной детализации</td></tr>`;

  document.getElementById('modalBody').innerHTML = `
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl p-3">
          <div class="text-[10px] text-slate-500 uppercase">Покупатель</div>
          <div class="text-sm font-medium mt-1">${obj.name || 'Свободно'}</div>
        </div>
        <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl p-3">
          <div class="text-[10px] text-slate-500 uppercase">Статус</div>
          <div class="mt-1">${statusBadge(obj.status)}</div>
        </div>
        <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl p-3">
          <div class="text-[10px] text-slate-500 uppercase">Площадь</div>
          <div class="text-sm font-medium mt-1">${obj.area ? obj.area + ' м²' : '—'}</div>
        </div>
        <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl p-3">
          <div class="text-[10px] text-slate-500 uppercase">Стоимость</div>
          <div class="text-sm font-medium mt-1">${obj.roomAmount ? money(obj.roomAmount) : '—'}</div>
        </div>
        <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl p-3">
          <div class="text-[10px] text-slate-500 uppercase">Оплачено</div>
          <div class="text-sm font-semibold text-emerald-300 mt-1">${money(obj.paid)}</div>
        </div>
        <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl p-3">
          <div class="text-[10px] text-slate-500 uppercase">Остаток</div>
          <div class="text-sm font-semibold text-rose-300 mt-1">${obj.baqiya !== null ? money(obj.baqiya) : '—'}</div>
        </div>
      </div>

      <div>
        <h4 class="text-xs uppercase tracking-wide text-slate-500 mb-2">История выплат по месяцам</h4>
        <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl overflow-hidden">
          <table class="w-full text-sm">
            <tbody>${historyRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
  if (window.innerWidth <= 640) {
    setTimeout(() => content.classList.add('open'), 10);
  }
}

function closeModal() {
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');
  if (window.innerWidth <= 640) {
    content.classList.remove('open');
    setTimeout(() => modal.classList.add('hidden'), 250);
  } else {
    modal.classList.add('hidden');
  }
}

/* =========================================================
   INIT
   ========================================================= */
function renderAll() {
  renderKpi();
  renderTabs();
  renderStatusFilter();
  renderChessboards();
  renderTable();
}

document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value.trim();
  renderTable();
});

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalBackdrop').onclick = closeModal;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

renderAll();
</script>
