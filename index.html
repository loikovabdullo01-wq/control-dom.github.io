let lang = (function () {
  try { return localStorage.getItem('language') || 'ru'; } catch (e) { return 'ru'; }
})();

function t(key) {
  if (I18N[lang] && I18N[lang][key]) return I18N[lang][key];
  if (I18N.ru[key]) return I18N.ru[key];
  return key;
}

function applyLanguage(next) {
  lang = next === 'tj' ? 'tj' : 'ru';
  try { localStorage.setItem('language', lang); } catch (e) {}
  document.documentElement.setAttribute('lang', lang === 'tj' ? 'tg' : 'ru');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const v = t(el.dataset.i18nPh);
    if (v) el.placeholder = v;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const v = t(el.dataset.i18nTitle);
    if (v) el.title = v;
  });

  const langBtn = document.getElementById('langBtn');
  if (langBtn) langBtn.textContent = lang === 'ru' ? 'RU' : 'TJ';

  renderAll();

  const rm = document.getElementById('reportsModal');
  if (rm && !rm.classList.contains('hidden')) renderReports();
}

function applyTheme(theme) {
  const isDark = theme !== 'light';
  document.documentElement.classList.toggle('dark', isDark);
  try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}

/* =========================================================
   АВТОРИЗАЦИЯ
   ========================================================= */
const ACCESS_PASSWORD = '181279';
const STORAGE_KEY = 'sso_manager_token';
const STORAGE_VALUE = 'verified_true';

(function initAuth() {
  const loginScreen = document.getElementById('loginScreen');
  const form = document.getElementById('loginForm');
  const input = document.getElementById('password');
  const error = document.getElementById('loginError');

  if (localStorage.getItem(STORAGE_KEY) === STORAGE_VALUE) {
    loginScreen.classList.add('hidden-login');
  } else {
    setTimeout(() => input.focus(), 100);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value === ACCESS_PASSWORD) {
      localStorage.setItem(STORAGE_KEY, STORAGE_VALUE);
      loginScreen.classList.add('hidden-login');
      input.value = '';
      error.classList.add('hidden');
    } else {
      error.classList.remove('hidden');
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
      input.select();
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    loginScreen.classList.remove('hidden-login');
    input.value = '';
    error.classList.add('hidden');
    setTimeout(() => input.focus(), 200);
  });
})();

const LAYOUT = [
  {floor:0,  units:[1,2,3,4,5]},
  {floor:1,  units:[1,2,3,4,5]},
  {floor:2,  units:[1,2,3,4,5]},
  {floor:3,  units:[1,2,3,4,5,6,7,8]},
  {floor:4,  units:[1,2,3,4,5,6,7,8]},
  {floor:5,  units:[1,2,3,4,5,6,7,8]},
  {floor:6,  units:[1,2,3,4,5,6,7,8]},
  {floor:7,  units:[1,2,3,4,5,6,7,8]},
  {floor:8,  units:[1,2,3,4,5,6,7,8]},
  {floor:9,  units:[1,2,3,4,5,6,7,8]},
  {floor:10, units:[1,2,3,4,5]}
];
const BLOCKS = ['А','Б','В'];

const ALL_OBJECTS = [];
BLOCKS.forEach(block => {
  LAYOUT.forEach(({floor, units}) => {
    units.forEach(unit => {
      const number = `${floor}/${unit}`;
      const occ = OCCUPIED.find(o => o.block === block && o.number === number);
      if (occ) {
        const hasOwner = !!occ.name;
        const bal = (occ.baqiya === null || occ.baqiya === undefined) ? null : Number(occ.baqiya);
        ALL_OBJECTS.push({
          block, number, floor, unit,
          name: occ.name || '', area: occ.area, price: occ.price,
          roomAmount: occ.roomAmount, paid: occ.paid || 0, baqiya: bal,
          history: occ.history || [],
          status: !hasOwner ? 'free' : (bal === 0 ? 'sold' : 'installment')
        });
      } else {
        ALL_OBJECTS.push({
          block, number, floor, unit,
          name: '', area: null, price: null, roomAmount: null,
          paid: 0, baqiya: null, history: [], status: 'free'
        });
      }
    });
  });
});

function calcKpi(objects) {
  const total = objects.length;
  const sold = objects.filter(o => o.status === 'sold').length;
  const inst = objects.filter(o => o.status === 'installment').length;
  const free = objects.filter(o => o.status === 'free').length;
  const paid = objects.reduce((s, o) => s + (o.paid || 0), 0);
  const baqiya = objects.reduce((s, o) => s + (o.baqiya || 0), 0);
  return { total, sold, inst, free, paid, baqiya };
}

const KPI = calcKpi(ALL_OBJECTS);

function money(v) {
  return new Intl.NumberFormat('ru-RU').format(Math.round(v || 0)) + ' с.';
}

function renderKpi() {
  const el = document.getElementById('kpi');

    { label: t('kpiTotal'),  value: KPI.total,          color:'text-slate-100' },
    { label: t('kpiSold'),   value: KPI.sold,           color:'text-emerald-400' },
    { label: t('kpiInst'),   value: KPI.inst,           color:'text-amber-400' },
    { label: t('kpiFree'),   value: KPI.free,           color:'text-slate-400' },
    { label: t('kpiPaid'),   value: money(KPI.paid),    color:'text-emerald-300' },
    { label: t('kpiBaqiya'), value: money(KPI.baqiya),  color:'text-rose-300' }

function toFsValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'string') return { stringValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  return { stringValue: String(v) };
}

function fromFsValue(v) {
  if (!v || typeof v !== 'object') return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('booleanValue' in v) return !!v.booleanValue;
  if ('nullValue' in v) return null;

}

async function loadReportsFromServer() {
  const fresh = {};
  REPORT_IDS.forEach(id => { fresh[id] = []; });
  const now = Date.now();
  const expiredIds = [];
  const collected = [];
  let pageToken = '';
  let guard = 0;
  do {
    guard++;
    if (guard > 20) break;
    let url = REPORTS_COLLECTION
      + '?key=' + encodeURIComponent(FIREBASE_API_KEY)
      + '&pageSize=300';
    if (pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
    const res = await fetch(url, { method: 'GET' });
    if (!res.ok) {
      let txt = '';
      try { txt = await res.text(); } catch (e) {}
      throw new Error('HTTP ' + res.status + ' ' + String(txt).slice(0, 200));
    }
    const data = await res.json();
    const docs = Array.isArray(data.documents) ? data.documents : [];
    docs.forEach(d => collected.push(d));
    pageToken = data.nextPageToken || '';
  } while (pageToken);

  collected.forEach(doc => {
    const item = fsDocToReport(doc);
    if (!item.id) return;
    const exp = Number(item.deleteAfter || 0);
    if (!exp || exp <= now) { expiredIds.push(item.id); return; }
    if (item.reportType && fresh[item.reportType]) fresh[item.reportType].push(item);
  });

  if (expiredIds.length) {
    await Promise.all(expiredIds.map(id => deleteReportDoc(id).catch(err => {
      console.warn('Не удалось удалить просроченный отчёт:', id, err);
    })));
  }

  Object.keys(fresh).forEach(k => {
    fresh[k].sort((a, b) => (Number(b.dateUploaded) || 0) - (Number(a.dateUploaded) || 0));
  });

  reportsCache = fresh;
  return reportsCache;
}

/* ---- Подготовка изображения ---- */
async function prepareImageDataUrl(file) {
  const MAX_ORIGINAL = 30 * 1024 * 1024;
  if (file.size > MAX_ORIGINAL) throw new Error('Файл слишком большой (макс. 30 МБ): ' + file.name);
  if (!file.type || !file.type.startsWith('image/')) throw new Error('Не изображение: ' + (file.name || 'файл'));
  const dataUrl = await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ''));
    fr.onerror = () => reject(new Error('Не удалось прочитать файл'));
    fr.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error('Формат не поддерживается браузером: ' + (file.name || '')));
    i.src = dataUrl;
  });
  const MAX_SIDE = 1800;
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  if (!w || !h) throw new Error('Пустое изображение');
  if (w > MAX_SIDE || h > MAX_SIDE) {
    const k = MAX_SIDE / Math.max(w, h);
    w = Math.max(1, Math.round(w * k));
    h = Math.max(1, Math.round(h * k));
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.75);
}

function dataUrlToBlob(dataUrl) {
  const comma = dataUrl.indexOf(',');
  const header = dataUrl.slice(0, comma);
  const b64 = dataUrl.slice(comma + 1);
  const mime = (header.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function uploadImageToImgBB(file) {
  const jpegDataUrl = await prepareImageDataUrl(file);
  const cleanBase64 = jpegDataUrl.split(',')[1] || '';
  const fileName = 'report_' + Date.now() + '.jpg';
  let lastError = null;
  for (let i = 0; i < IMGBB_KEYS.length; i++) {
    const key = IMGBB_KEYS[i];
    try {
      const fd = new FormData();
      fd.append('image', cleanBase64);
      const res = await fetch('https://api.imgbb.com/1/upload?key=' + key, { method: 'POST', body: fd });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      if (res.ok && data && data.success && data.data) {
        const url = data.data.url || data.data.display_url || (data.data.image && data.data.image.url);
        if (url) return url;
      }
      const msg = (data && data.error && (data.error.message || data.error.code))
                  || (data && data.status_txt) || ('HTTP ' + res.status);
      lastError = new Error(msg + ' [key ' + (i + 1) + ']');
    } catch (err) { lastError = err; }
  }
  try {
    const blob = dataUrlToBlob(jpegDataUrl);
    const fd = new FormData();
    fd.append('file', blob, fileName);
    const res = await fetch('https://0x0.st', { method: 'POST', body: fd });
    const text = (await res.text()).trim();
    if (res.ok && /^https?:\/\//i.test(text)) return text;
    lastError = new Error('0x0.st: ' + text.slice(0, 120));
  } catch (e) { lastError = e; }
  try {
    const blob = dataUrlToBlob(jpegDataUrl);
    const fd = new FormData();
    fd.append('reqtype', 'fileupload');
    fd.append('fileToUpload', blob, fileName);
    const res = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: fd });
    const text = (await res.text()).trim();
    if (res.ok && /^https?:\/\//i.test(text)) return text;
    lastError = new Error('catbox: ' + text.slice(0, 120));
  } catch (e) { lastError = e; }
  throw lastError || new Error('Все хостинги недоступны');
}

  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;

  const d = new Date(Number(ts) || 0);
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;

  if (reportsState === 'loading' || reportsState === 'idle') {
    titleEl.textContent = t('reportsTitle');
    body.innerHTML = `<div class="text-center text-sm text-slate-400 py-10"><div class="animate-pulse">${t('loadingReports')}</div></div>`;
    return;
  }

  if (reportsState === 'error') {
    titleEl.textContent = t('reportsTitle');
    body.innerHTML = `
      <div class="space-y-3">
        <div class="text-xs rounded-xl px-3 py-2 border bg-rose-500/10 border-rose-500/30 text-rose-300 break-words">
          ${t('firebaseErr')}${reportsError || ''}
        </div>
        <div class="text-[11px] text-slate-400 leading-relaxed">${t('rulesHint')}</div>
        <button id="reportsRetry"
          class="px-4 py-2 rounded-xl text-xs font-medium bg-brand-500 hover:bg-brand-600 text-slate-950 transition">
          ${t('retry')}
        </button>
      </div>`;
    const retryBtn = document.getElementById('reportsRetry');
    if (retryBtn) retryBtn.onclick = () => reloadReports();
    return;
  }

  if (!activeReport) {
    titleEl.textContent = t('reportsTitle');
    body.innerHTML = `
      <div class="grid gap-2">
        ${REPORT_IDS.map(id => {
          const count = reportsFor(id).length;
          return `
            <button data-report="${id}"
              class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl bg-[#080c14]/60 border border-slate-700 hover:border-brand-500 transition text-left">
              <span class="text-sm font-medium">${reportName(id)}</span>
              <span class="text-xs text-slate-400 whitespace-nowrap">${count} ${t('pcs')}</span>
            </button>`;
        }).join('')}
      </div>
      <div id="reportStatus" class="hidden mt-3"></div>`;
    body.querySelectorAll('button[data-report]').forEach(btn => {
      btn.onclick = () => {
        activeReport = btn.dataset.report;
        reportStatus = null;
        renderReports();
      };
    });
    renderReportStatus();
    return;
  }

  const items = reportsFor(activeReport);
  titleEl.textContent = reportName(activeReport);

  const todayCount = countToday(activeReport);
  const remaining = Math.max(0, DAILY_LIMIT - todayCount);
  const limitReached = remaining <= 0;

  const gallery = items.length
    ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${items.map(it => {
          const showDate = it.customDate || fmtDate(it.dateUploaded);
          const note = (it.note || '').trim();
          const safeUrl = String(it.imageUrl || '');
          return `
          <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl overflow-hidden">
            <a href="${safeUrl}" target="_blank" rel="noopener">
              <img src="${safeUrl}" alt="report" loading="lazy" class="w-full h-40 object-cover" />
            </a>
            <div class="p-3 space-y-1.5">
              <div class="text-xs font-medium text-slate-200">${t('reportDateLabel')}: <span class="text-brand-500">${showDate}</span></div>
              ${note ? `<div class="text-xs text-slate-300 break-words">${t('reportNoteLabel')}: ${note}</div>` : `<div class="text-xs text-slate-500">${t('reportNoteLabel')}: ${t('reportNoteEmpty')}</div>`}
              <div class="text-[10px] text-slate-500 pt-1 border-t border-slate-800/60">
                ${t('uploadedAt')}: ${fmtDate(it.dateUploaded)} · ${t('expiresAt')}: ${fmtDate(it.deleteAfter)}
              </div>
              <button data-del="${it.id}"
                class="w-full mt-1 px-2 py-1 rounded-lg text-[10px] bg-rose-500/15 text-rose-300 border border-rose-500/30 hover:bg-rose-500/25 transition">
                ${t('delete')}
              </button>
            </div>
          </div>`;
        }).join('')}
      </div>`
    : `<div class="text-center text-sm text-slate-500 py-6">${t('noReports')}</div>`;

  const limitBadgeClass = limitReached
    ? 'bg-rose-500/10 border-rose-500/40 text-rose-300'
    : (todayCount >= 8 ? 'bg-amber-500/10 border-amber-500/40 text-amber-300' : 'bg-emerald-500/10 border-emerald-500/40 text-emerald-300');

  body.innerHTML = `
    <div class="space-y-4">
      <div class="flex flex-wrap items-center gap-2">
        <button id="reportBack"
          class="px-3 py-2 rounded-xl text-xs bg-[#080c14]/60 border border-slate-700 hover:border-slate-500 transition">
          ${t('back')}
        </button>
        <div class="ml-auto text-[11px] rounded-xl px-3 py-2 border ${limitBadgeClass} whitespace-nowrap">
          ${t('dailyUploadedToday')}: <b>${todayCount}</b> / ${DAILY_LIMIT}
        </div>
      </div>

      <div class="bg-[#080c14]/60 border border-slate-800 rounded-xl p-3 space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] uppercase tracking-wide text-slate-500 mb-1">${t('reportDateLabel')}</label>
            <input id="reportDate" type="date" value="${todayISO()}"
              class="w-full bg-[#0f1624] border border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:border-brand-500 report-input" />
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wide text-slate-500 mb-1">${t('reportNoteLabel')}</label>
            <input id="reportNote" type="text" placeholder="${t('reportNotePlaceholder')}"
              class="w-full bg-[#0f1624] border border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:border-brand-500 placeholder:text-slate-500 report-input" />
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button id="reportUploadBtn"
            class="px-4 py-2 rounded-xl text-xs font-medium transition ${limitReached ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : 'bg-brand-500 hover:bg-brand-600 text-slate-950'}"
            ${limitReached ? 'disabled' : ''}>
            ⬆ ${t('uploadBtn')}
          </button>
          <span class="text-[11px] text-slate-500">
            ${limitReached ? t('dailyLimitReached') : t('selectImages') + ' (' + remaining + ' / ' + DAILY_LIMIT + ')'}
          </span>
        </div>
        <input id="reportFileInput" type="file" accept="image/*" multiple class="hidden" />
      </div>

      <div id="reportStatus" class="hidden"></div>

      <div id="reportGallery">${gallery}</div>
    </div>`;

  document.getElementById('reportBack').onclick = () => {
    activeReport = null;
    reportStatus = null;
    renderReports();
  };

  const fileInput = document.getElementById('reportFileInput');
  const uploadBtn = document.getElementById('reportUploadBtn');
  if (uploadBtn && !limitReached) {
    uploadBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleReportFiles(e.target.files, fileInput);
  }

  body.querySelectorAll('button[data-del]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm(t('confirmDelete'))) return;
      const id = btn.dataset.del;
      btn.disabled = true;
      btn.classList.add('opacity-50');
      try {
        await deleteReportDoc(id);
        reportsCache[activeReport] = reportsFor(activeReport).filter(it => it.id !== id);
        reportStatus = { type: 'ok', text: t('delete') + ' ✓' };
      } catch (err) {
        console.error('Delete failed:', err);
        reportStatus = { type: 'err', text: t('deleteErr') + (err && err.message ? err.message : 'error') };
      }
      renderReports();
    };
  });

  renderReportStatus();
}

async function handleReportFiles(files, inputEl) {
  if (!files || !files.length) return;
  const list = Array.from(files);

  const remaining = DAILY_LIMIT - countToday(activeReport);
  if (remaining <= 0) {
    if (inputEl) inputEl.value = '';
    reportStatus = { type: 'err', text: t('dailyLimitReached') };
    renderReports();
    return;
  }

  const willUpload = list.slice(0, remaining);
  const skipped = list.length - willUpload.length;

  const dateEl = document.getElementById('reportDate');
  const noteEl = document.getElementById('reportNote');
  const customDate = dateEl && dateEl.value ? dateEl.value : todayISO();
  const note = noteEl && noteEl.value ? noteEl.value.trim() : '';

  reportStatus = { type: 'load', text: t('uploading') + ' 0/' + willUpload.length };
  renderReportStatus();

  let okCount = 0;
  let errText = '';

  for (let i = 0; i < willUpload.length; i++) {
    try {
      const url = await uploadImageToImgBB(willUpload[i]);
      const now = Date.now();
      const item = {
        id: 'r' + now + '_' + Math.random().toString(36).slice(2, 8),
        reportType: activeReport,
        imageUrl: url,
        dateUploaded: now,
        deleteAfter: now + REPORT_TTL,
        customDate: customDate,
        note: note
      };
      await addReportDoc(item);
      if (!reportsCache[activeReport]) reportsCache[activeReport] = [];
      reportsCache[activeReport].unshift(item);
      reportsCache[activeReport].sort((a, b) => (Number(b.dateUploaded) || 0) - (Number(a.dateUploaded) || 0));
      okCount++;
    } catch (err) {
      errText = (err && err.message) ? err.message : 'error';
      console.error('Upload failed:', err);
    }
    reportStatus = { type: 'load', text: t('uploading') + ' ' + (i + 1) + '/' + willUpload.length };
    renderReportStatus();
  }

  if (inputEl) inputEl.value = '';

  if (okCount > 0 && !errText && skipped === 0) {
    reportStatus = { type: 'ok', text: t('uploadOk') + okCount + ' ' + t('pcs') };
  } else if (okCount > 0 && !errText && skipped > 0) {
    reportStatus = { type: 'err', text: t('dailyLimitPartial') + ' (загружено ' + okCount + ', пропущено ' + skipped + ')' };
  } else if (okCount > 0 && errText) {
    reportStatus = { type: 'err', text: t('uploadErr') + errText };
  } else {
    reportStatus = { type: 'err', text: t('uploadErr') + (errText || 'error') };
  }

  renderReports();
}

async function reloadReports() {
  reportsState = 'loading';
  reportsError = '';
  renderReports();
  try {
    await loadReportsFromServer();
    reportsState = 'ready';
  } catch (err) {
    console.error('Firebase load error:', err);
    reportsState = 'error';
    reportsError = (err && err.message) ? err.message : 'unknown error';
  }
  renderReports();
}

async function openReportsModal() {
  activeReport = null;
  reportStatus = null;
  showSheet(document.getElementById('reportsModal'), document.getElementById('reportsContent'));

  if (reportsState === 'ready') {
    renderReports();
    loadReportsFromServer().then(() => {
      reportsState = 'ready';
      if (!document.getElementById('reportsModal').classList.contains('hidden')) renderReports();
    }).catch(err => console.warn('Firebase refresh error:', err));
    return;
  }
  await reloadReports();
}

function closeReportsModal() {
  hideSheet(document.getElementById('reportsModal'), document.getElementById('reportsContent'));
}

/* =========================================================
   INIT
   ========================================================= */
function renderAll() {
  renderKpi();
  renderTabs();
  renderStatusFilter();
  renderChessboards();
  renderTable();
}

document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value.trim();
  renderTable();
});

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalBackdrop').onclick = closeModal;
document.getElementById('reportsBtn').onclick = openReportsModal;
document.getElementById('reportsClose').onclick = closeReportsModal;
document.getElementById('reportsBackdrop').onclick = closeReportsModal;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeReportsModal(); }
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const isDark = document.documentElement.classList.contains('dark');
  applyTheme(isDark ? 'light' : 'dark');
});

document.getElementById('langBtn').addEventListener('click', () => {
  applyLanguage(lang === 'ru' ? 'tj' : 'ru');
});

(function init() {
  let savedTheme = 'dark';
  try { savedTheme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  applyTheme(savedTheme);
  applyLanguage(lang);

  /* Фоновая загрузка отчётов + авто-очистка просроченных */
  reportsState = 'loading';
  loadReportsFromServer()
    .then(() => { reportsState = 'ready'; })
    .catch(err => {
      console.warn('Firebase init load error:', err);
      reportsState = 'error';
      reportsError = (err && err.message) ? err.message : 'unknown error';
    });
})();
</script>
</body>
